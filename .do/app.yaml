# Spec de DigitalOcean App Platform para el FRONTEND de CROM.
#
# El backend vive en su propia app y su propio repositorio
# (Elstevenmedina/crom_backend), publicado en:
#   https://seashell-app-yw9ur.ondigitalocean.app/api
# Por eso este spec solo describe el sitio, y la API se consume por URL absoluta.
#
# Aplicar con:
#   doctl apps list                                      # id de la app del sitio
#   doctl apps spec get <APP_ID> > .do/app.actual.yaml   # respaldo antes de tocar nada
#   doctl apps update <APP_ID> --spec .do/app.yaml
#
# IMPORTANTE:
# - `name` debe coincidir con el nombre de la app actual; si no, se crea una app nueva.
# - Este spec REEMPLAZA la configuracion completa de la app.
# - El sitio hoy corre como servicio (`vite preview`). Aqui se declara como static site,
#   que en App Platform no tiene costo de instancia y sirve el build por CDN. Es un
#   cambio de tipo de componente: revisa el respaldo antes de aplicar.

name: crom
region: nyc

static_sites:
  - name: crom-web
    github:
      repo: Elstevenmedina/crom2
      branch: main
      deploy_on_push: true
    source_dir: /
    environment_slug: node-js
    build_command: npm ci && npm run build
    output_dir: dist
    # React Router necesita que cualquier ruta devuelva el index
    catchall_document: index.html

    envs:
      # URL absoluta del backend: son dos apps distintas, no comparten dominio.
      # Vite hornea este valor en el bundle, por eso el scope es BUILD_TIME:
      # cambiarlo exige reconstruir, no basta con reiniciar.
      #
      # Si algun dia la API pasa a un dominio propio (por ejemplo api.cromlatam.com),
      # hay que actualizar este valor y volver a desplegar el frontend.
      - key: VITE_API_URL
        scope: BUILD_TIME
        value: https://seashell-app-yw9ur.ondigitalocean.app/api

      - key: VITE_EMAILJS_PUBLIC_KEY
        scope: BUILD_TIME
        value: PEGAR_EMAILJS_PUBLIC_KEY

      - key: VITE_EMAILJS_SERVICE_ID
        scope: BUILD_TIME
        value: service_3w339jd

      - key: VITE_EMAILJS_TEMPLATE_USER
        scope: BUILD_TIME
        value: template_ymu1a5o

      - key: VITE_EMAILJS_TEMPLATE_ADMIN
        scope: BUILD_TIME
        value: template_9gnt1ik

# El dominio ya esta configurado en la app actual y el DNS vive en Cloudflare.
# Se deja comentado para no pisar esa configuracion al aplicar el spec.
# domains:
#   - domain: cromlatam.com
#     type: PRIMARY
#   - domain: www.cromlatam.com
#     type: ALIAS
